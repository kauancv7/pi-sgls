services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sglscommerce-frontend

    ports:
      - "3001:3000"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    environment:
      NODE_ENV: development

    command: npm run dev -- -H 0.0.0.0